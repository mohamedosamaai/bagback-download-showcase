<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    img {
      width: 64px;
      height: 64px;
      margin-bottom: 12px;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }
    p {
      margin: 0 0 16px 0;
      font-size: 13px;
      color: #94a3b8;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <img src="icons/icon-128.png" alt="Bagback Logo">
  <h2>Bagback Download</h2>
  <p>Download video or audio from the current page.</p>
  <button id="send-btn">Send to Bagback</button>
  <script src="popup.js"></script>
</body>
</html>
