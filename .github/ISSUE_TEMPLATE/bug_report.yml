name: 🪲 Bug Report
description: Report a bug or defect in the codebase.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a defect! Please complete this structured form to help us triage the issue.
  - type: input
    id: title
    attributes:
      label: Summary
      placeholder: A short, descriptive summary of the bug.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      placeholder: Provide a clear and detailed description of what is happening.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Paste URL '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      placeholder: |
        - Operating System: (e.g. Windows 11, macOS Sequoia)
        - Browser: (e.g. Chrome 126, Safari 17)
        - Deploy Mode: (Self-hosted Node / PWA / Mock Sandbox)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      placeholder: Paste console stack traces or logs here.
    validations:
      required: false
