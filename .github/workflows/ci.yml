name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Type Checking (Web)
        run: npx --workspace=@bagback-download/web tsc --noEmit

      - name: Type Checking (Server)
        run: npx --workspace=@bagback-download/server tsc --noEmit

      - name: Run Linting Verification
        run: npm run lint

      - name: Production Build
        run: npm run build
