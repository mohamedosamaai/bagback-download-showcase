name: Publish Packages

on:
  release:
    types: [published]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohamedosamaai'

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Publish Core Package
        run: |
          npm publish ./packages/core --access public || echo "Core package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Engine Package
        run: |
          npm publish ./packages/downloader-engine --access public || echo "Engine package version already published"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
